<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <script src="js/scale.js"></script>
  <title>Periodo de prueba · Aurea</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    body{overflow:hidden;}
    .layout{display:grid;grid-template-columns:300px 1fr;height:calc(var(--real-vh) - var(--nav-height));}
    .col-left{border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--night-soft);}
    .col-head{padding:16px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
    .col-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:14px;font-weight:600;color:var(--night);flex-shrink:0;}
    .col-head-name{font-family:var(--font-serif);font-size:16px;font-weight:500;color:var(--text-primary);}
    .col-head-sub{font-size:10px;font-weight:300;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-top:2px;}
    .sesiones-title{padding:14px 20px 8px;font-size:9px;font-weight:400;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-faint);border-bottom:0.5px solid var(--border);flex-shrink:0;}
    .sesiones-list{flex:1;overflow-y:auto;padding:8px 0;}
    .sesion-item{padding:12px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:0.5px solid var(--border);transition:background 0.15s;}
    .sesion-item:hover{background:var(--night-mid);}
    .sesion-num{font-family:var(--font-serif);font-size:22px;font-weight:400;color:var(--text-faint);width:28px;flex-shrink:0;text-align:center;}
    .sesion-n{color:var(--gold);}
    .sesion-info{flex:1;}
    .sesion-title{font-size:12px;font-weight:400;color:var(--text-primary);margin-bottom:2px;}
    .sesion-fecha{font-size:10px;font-weight:300;color:var(--text-faint);}
    .sesion-badge{font-size:8px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:100px;white-space:nowrap;flex-shrink:0;}
    .sb-done{color:var(--green);background:#E2EFD3;border:0.5px solid #3B6D1144;}
    .sb-today{color:var(--gold);background:var(--night-deep);border:0.5px solid var(--border-gold);}
    .sb-pending{color:var(--text-faint);background:var(--night-mid);border:0.5px solid var(--border);}
    .progress-section{padding:14px 20px;border-top:0.5px solid var(--border);flex-shrink:0;}
    .prog-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
    .prog-text{font-size:10px;font-weight:300;color:var(--text-muted);}
    .prog-pct{font-family:var(--font-serif);font-size:13px;color:var(--gold);}
    .prog-bar{height:4px;background:var(--border);border-radius:100px;overflow:hidden;}
    .prog-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#A67828,#C8973A);}
    .decision-band{padding:14px 20px;border-top:0.5px solid var(--border);background:var(--night-mid);flex-shrink:0;display:flex;gap:8px;}
    .btn-decision{flex:1;font-family:var(--font-serif);font-size:14px;font-style:italic;padding:11px;border-radius:100px;cursor:pointer;transition:all 0.2s;border:none;}
    .btn-accept{color:var(--night);background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));box-shadow:0 4px 12px #C8973A33;}
    .btn-cancel{color:var(--text-muted);background:none;border:0.5px solid var(--border);}
    .btn-cancel:hover{color:var(--text-primary);border-color:var(--border-soft);}
    .col-right{display:flex;flex-direction:column;overflow:hidden;}
    .chat-header{padding:14px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .chat-title{font-family:var(--font-serif);font-size:17px;font-weight:500;color:var(--text-primary);}
    .chat-sub{font-size:10px;font-weight:300;color:var(--text-faint);}
    .chat-badge{font-size:9px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;color:var(--purple);background:#E7E4F5;border:0.5px solid #53489744;}
    .chat-badge.consolidada{color:var(--green);background:#E2EFD3;border:0.5px solid #3B6D1144;}
    .chat-badge.cancelada{color:var(--text-faint);background:var(--night-mid);border:0.5px solid var(--border);}
    .messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
    .msg{max-width:70%;display:flex;flex-direction:column;gap:3px;}
    .msg.mine{align-self:flex-end;}
    .msg.theirs{align-self:flex-start;}
    .msg-bubble{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;}
    .msg.theirs .msg-bubble{background:var(--night-mid);border:0.5px solid var(--border);border-radius:2px 10px 10px 10px;}
    .msg.mine .msg-bubble{background:var(--night-deep);border:0.5px solid var(--border-gold);border-radius:10px 2px 10px 10px;}
    .msg-meta{font-size:9px;color:var(--text-ghost);}
    .msg.mine .msg-meta{text-align:right;}
    .chat-input-bar{padding:12px 16px;border-top:0.5px solid var(--border);display:flex;gap:8px;flex-shrink:0;}
    .chat-textarea{flex:1;background:var(--night-mid);border:0.5px solid var(--border);border-radius:8px;padding:10px 14px;font-family:var(--font-serif);font-size:14px;font-style:italic;color:var(--text-primary);outline:none;resize:none;height:44px;line-height:1.5;}
    .chat-textarea:focus{border-color:var(--gold);}
    .chat-textarea::placeholder{color:var(--text-ghost);}
    .chat-send-btn{background:var(--gold);border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
    .chat-send-btn:disabled{opacity:0.4;cursor:default;}
    .modal-title{font-family:var(--font-serif);font-size:22px;font-weight:500;color:var(--text-primary);}
    .modal-sub{font-size:12px;font-weight:300;color:var(--text-muted);line-height:1.7;}
    .modal-ta{background:var(--night-soft);border:0.5px solid var(--border-soft);border-radius:8px;padding:12px;font-family:var(--font-serif);font-size:14px;font-style:italic;color:var(--text-primary);outline:none;resize:none;height:90px;width:100%;margin-top:4px;}
    .modal-ta:focus{border-color:var(--gold);}
    .modal-ta::placeholder{color:var(--text-faint);}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
    .btn-mb{font-size:11px;font-weight:300;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);background:none;border:0.5px solid var(--border);padding:9px 16px;border-radius:100px;cursor:pointer;}
    .btn-mac{font-size:11px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:var(--night);background:var(--gold);border:none;padding:9px 20px;border-radius:100px;cursor:pointer;}
    .btn-mca{font-size:11px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:#fff;background:var(--red);border:none;padding:9px 20px;border-radius:100px;cursor:pointer;}
    .sobre-cerrado{text-align:center;padding:24px;background:var(--night-soft);border:0.5px solid var(--border-gold);border-radius:12px;margin:8px 0;}
    .sobre-icon{font-size:36px;margin-bottom:10px;}
    .sobre-title{font-family:var(--font-serif);font-size:20px;font-weight:500;color:var(--text-primary);margin-bottom:6px;}
    .sobre-sub{font-size:11px;font-weight:300;color:var(--text-muted);line-height:1.6;}
    .msgs-empty{text-align:center;padding:40px 20px;font-family:var(--font-serif);font-size:14px;font-style:italic;color:var(--text-faint);}
    .ya-decidio{width:100%;text-align:center;font-size:11px;font-weight:300;color:var(--text-muted);padding:12px 0;letter-spacing:0.04em;}
    /* — Ritual guiado del periodo de prueba (spec 041) — */
    .rit-item{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-bottom:0.5px solid var(--border);}
    .rit-num{font-family:var(--font-serif);font-size:18px;font-weight:400;color:var(--border);width:22px;flex-shrink:0;text-align:center;line-height:1.3;}
    .rit-item.done .rit-num{color:var(--green);}
    .rit-item.current .rit-num{color:var(--gold);}
    .rit-info{flex:1;min-width:0;}
    .rit-title{font-size:12px;font-weight:400;color:var(--text-primary);line-height:1.4;}
    .rit-item.current .rit-title{color:var(--gold);}
    .rit-state{font-size:10px;font-weight:300;color:var(--text-faint);margin-top:2px;line-height:1.5;}
    .rit-item.current .rit-state{color:var(--text-muted);}
    .rit-det{margin-top:5px;}
    .rit-det summary{font-size:10px;color:var(--text-muted);cursor:pointer;list-style:none;border-bottom:0.5px dotted var(--border);display:inline;}
    .rit-det summary::-webkit-details-marker{display:none;}
    .rit-det summary:hover{color:var(--gold);}
    .rit-det[open] summary{color:var(--gold);}
    .rit-det-body{font-size:11px;font-weight:300;color:var(--text-muted);line-height:1.6;padding:7px 0 2px;}
    .rit-det-body ul{margin:5px 0 0;padding-left:16px;}
    .rit-det-body li{margin-bottom:3px;}
    .next-step{padding:12px 16px;border-bottom:0.5px solid var(--border);background:var(--night-mid);}
    .next-step-hd{font-size:9px;font-weight:400;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
    .next-step-txt{font-size:11px;font-weight:300;color:var(--text-secondary);line-height:1.6;}
    .next-step-cta{margin-top:9px;}
    .next-step-cta button{width:100%;font-family:var(--font-serif);font-size:13px;font-style:italic;color:var(--gold);background:none;border:0.5px solid var(--border-gold);padding:9px;border-radius:100px;cursor:pointer;transition:background .18s;}
    .next-step-cta button:hover{background:rgba(200,151,58,.08);}
    .tpl-wrap{padding:10px 16px;border-bottom:0.5px solid var(--border);}
    .tpl-wrap summary{font-size:10px;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-faint);cursor:pointer;list-style:none;}
    .tpl-wrap summary::-webkit-details-marker{display:none;}
    .tpl-wrap summary:hover{color:var(--gold);}
    .tpl-item{margin-top:10px;}
    .tpl-label{font-size:10px;font-weight:400;color:var(--text-muted);margin-bottom:4px;}
    .tpl-text{font-family:var(--font-serif);font-size:12px;font-style:italic;color:var(--text-secondary);line-height:1.6;background:var(--night-mid);border:0.5px solid var(--border);border-radius:8px;padding:9px 11px;}
    .tpl-btns{display:flex;gap:6px;margin-top:6px;}
    .tpl-btns button{font-size:10px;font-weight:300;color:var(--text-muted);background:none;border:0.5px solid var(--border);padding:5px 11px;border-radius:100px;cursor:pointer;transition:all .18s;}
    .tpl-btns button:hover{color:var(--gold);border-color:var(--gold);}
    /* Móvil: la página deja de ser una app de altura fija (el ritual necesita
       scroll de página; global.css apila .layout en bloque a ≤899px). */
    @media(max-width:899px){
      body{overflow:auto;}
      .layout{height:auto;}
      .messages{min-height:300px;max-height:55vh;}
    }
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <div class="layout">
    <div class="col-left">
      <div class="col-head">
        <div class="col-avatar" id="col-avatar" style="background:#C8973A;">…</div>
        <div>
          <div class="col-head-name" id="col-head-name">Cargando…</div>
          <div class="col-head-sub" id="col-head-sub"></div>
        </div>
      </div>
      <div class="sesiones-title">Camino del periodo de prueba · <span id="sesiones-count">—/3</span> sesiones</div>
      <div class="sesiones-list" id="ritual-wrap">
        <div class="next-step" id="next-step" hidden>
          <div class="next-step-hd">Próximo paso</div>
          <div class="next-step-txt" id="next-step-txt"></div>
          <div class="next-step-cta" id="next-step-cta" hidden><button type="button" id="next-step-btn"></button></div>
        </div>
        <div id="ritual-list" aria-label="Etapas del periodo de prueba">
          <!-- Timeline de 6 etapas (renderizado dinámico) -->
        </div>
        <details class="tpl-wrap" id="tpl-wrap" hidden>
          <summary>Plantillas de mensaje</summary>
          <div id="tpl-list"></div>
        </details>
      </div>
      <div class="progress-section">
        <div class="prog-label">
          <span class="prog-text" id="prog-text">Periodo de prueba</span>
          <span class="prog-pct" id="prog-pct">— / —</span>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%;"></div></div>
      </div>
      <div class="decision-band" id="decision-band">
        <button class="btn-decision btn-accept" onclick="openDecision('consolidar')">Sí, consolidar</button>
        <button class="btn-decision btn-cancel" onclick="openDecision('no_consolidar')">No consolidar</button>
      </div>
    </div>
    <div class="col-right">
      <div class="chat-header">
        <div>
          <div class="chat-title" id="chat-title">…</div>
          <div class="chat-sub">Periodo de prueba activo</div>
        </div>
        <span class="chat-badge" id="chat-badge">⏳ En prueba · — días</span>
      </div>
      <div class="messages" id="messages">
        <div class="msgs-empty">Cargando mensajes…</div>
      </div>
      <div class="chat-input-bar">
        <textarea class="chat-textarea" id="msg-input" placeholder="Escribe un mensaje…"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button class="chat-send-btn" id="send-btn" onclick="sendMsg()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M2 8L14 2L8 14L7 9L2 8Z" fill="#1C1410"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal decisión (sobre cerrado) -->
  <div class="overlay" id="modal-decision">
    <div class="modal" style="width:440px;">
      <div class="sobre-cerrado">
        <div class="sobre-icon">◎</div>
        <div class="sobre-title">Decisión en sobre cerrado</div>
        <div class="sobre-sub" id="decision-sub"></div>
      </div>
      <div class="modal-sub" style="margin-top:10px;">Esta decisión no podrá cambiarse desde Aurea después de enviarla.</div>
      <div class="modal-actions">
        <button class="btn-mb" onclick="closeModals()">Volver</button>
        <button class="btn-mac" id="decision-confirm-btn" onclick="confirmarDecision()">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="chat-container"></div>
  <script src="js/components.js"></script>
  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth } from './js/auth.js';
    import { checkNotificaciones, refreshMsgBadge } from './js/notif.js';

    (async () => {
    const session = await requireAuth();
    if (!session) return;
    const uid = session.user.id;

    // — Relacion ID desde URL —
    const params = new URLSearchParams(location.search);
    const relacionId = params.get('id');
    // Sin id se gestiona más abajo con un estado vacío (no se redirige en silencio).

    // — Nav con iniciales reales —
    const { data: me } = await supabase.from('profiles')
      .select('nombre, apellido').eq('id', uid).single();
    const ini = me ? ((me.nombre||'')[0] + (me.apellido||'')[0]).toUpperCase() || '?' : '?';
    document.getElementById('nav-container').innerHTML = renderNavAuth('relaciones', ini);
    checkNotificaciones();

    // — Cargar relacion con perfiles de ambas partes —
    const { data: rel, error: relErr } = await supabase
      .from('relaciones')
      .select(`
        *,
        maestro:profiles!maestro_id(nombre, apellido, avatar_color),
        discipulo:profiles!discipulo_id(nombre, apellido, avatar_color)
      `)
      .eq('id', relacionId)
      .single();

    if (relErr || !rel) {
      const lay = document.querySelector('.layout');
      if (lay) {
        lay.style.display = 'block';
        // Con id: no existe o no tienes acceso (la RLS no distingue ambos casos).
        // Sin id: entrada genérica. Nunca errores técnicos crudos.
        lay.innerHTML = relacionId
          ? renderEmptyState({
              icon: '🔍',
              title: 'No hemos encontrado este periodo de prueba',
              body: 'Puede que el enlace no sea válido o que no tengas acceso a esta relación.',
              ctaLabel: 'Ver relaciones',
              ctaHref: 'relaciones.html',
            })
          : renderEmptyState({
              icon: '⏳',
              title: 'No hay un periodo de prueba activo seleccionado',
              body: 'Cuando una solicitud sea aceptada, aquí podrás seguir los 30 días de prueba y las sesiones disponibles.',
              ctaLabel: 'Ver relaciones',
              ctaHref: 'relaciones.html',
            });
      }
      return; // detener init tras pintar el estado vacío (estamos en una IIFE async)
    }

    const esMaestro = rel.maestro_id === uid;
    const otroP = esMaestro ? rel.discipulo : rel.maestro;

    // — Panel izquierdo: datos del otro —
    const otroNombre = `${otroP.nombre} ${otroP.apellido || ''}`.trim();
    const otroIni = ((otroP.nombre||'')[0] + (otroP.apellido||'')[0]).toUpperCase() || '?';
    const avatarEl = document.getElementById('col-avatar');
    avatarEl.textContent = otroIni;
    avatarEl.style.background = otroP.avatar_color || '#C8973A';
    document.getElementById('col-head-name').textContent = otroNombre;
    document.getElementById('col-head-sub').textContent =
      `${rel.disciplina} · ${esMaestro ? 'Discípulo' : 'Maestro'}`;

    // — Sesiones reales (máximo 3 según el modelo del periodo de prueba) —
    const { data: sesiones } = await supabase
      .from('sesiones_prueba')
      .select('*')
      .eq('relacion_id', relacionId)
      .order('numero', { ascending: true });

    // — Estado del ritual (spec 041): se rellena según cargan datos —
    let _msgsCount = 0;       // mensajes de la conversación (etapa 1)
    let _miDec     = null;    // mi decisión propia (sobre cerrado) o null
    let _resultado = null;    // resultado final, solo si ambas partes decidieron
    let _tplRendered = false; // las plantillas se pintan una sola vez

    // Etapas de la guía (contenido fijo, UI-only).
    const ETAPAS_GUIA = [
      { titulo: 'Acordad la intención',
        det: 'Antes de empezar, aclarad qué queréis probar durante estos días.',
        puntos: ['Qué quiere aprender el discípulo', 'Qué puede ofrecer el maestro', 'Qué ritmo tiene sentido', 'Cómo sabréis si encaja'] },
      { titulo: 'Primera sesión: diagnóstico',
        det: 'Usad la primera conversación para entender el punto de partida y decidir si merece la pena seguir probando.',
        puntos: ['¿Desde dónde parte el discípulo?', '¿Qué necesita ahora?', '¿Qué puede aportar el maestro?', '¿Qué no encaja?'] },
      { titulo: 'Segunda sesión: práctica o revisión',
        det: 'La segunda sesión debería servir para probar la forma real de acompañamiento.',
        puntos: ['¿Hubo avance?', '¿El ritmo fue adecuado?', '¿La comunicación funciona?', '¿Hay compromiso por ambas partes?'] },
      { titulo: 'Tercera sesión: cierre de prueba',
        det: 'La última sesión debe servir para decidir si la relación merece consolidarse.',
        puntos: ['¿Queremos continuar?', '¿Qué cambiaríamos?', '¿Qué compromiso asumiría cada parte?', '¿Tiene sentido consolidar?'] },
      { titulo: 'Decisión por sobre cerrado',
        det: 'Cada persona decide por separado si quiere consolidar la relación. La decisión de la otra persona no se muestra hasta que ambas partes hayan decidido.',
        puntos: [] },
      { titulo: 'Resultado',
        det: 'Si ambos consolidáis, la relación queda consolidada. Si no, la prueba habrá servido para decidir con claridad.',
        puntos: [] },
    ];

    // Plantillas de mensaje (UI-only): nunca se envían solas; el usuario las
    // copia o las inserta en el textarea y decide si enviar.
    const PLANTILLAS = [
      esMaestro
        ? { label: 'Al inicio', texto: 'Bienvenido. Para aprovechar este periodo de prueba, cuéntame desde dónde partes y qué te gustaría conseguir.' }
        : { label: 'Al inicio', texto: 'Hola. Para empezar bien este periodo de prueba, me gustaría contarte qué busco aprender y qué espero de estos 30 días.' },
      { label: 'Antes de la segunda sesión', texto: 'Creo que en la próxima sesión podríamos revisar lo que ha funcionado hasta ahora y probar una forma más concreta de trabajo.' },
      { label: 'Antes de decidir', texto: 'Antes de tomar la decisión de consolidar o no, me gustaría que revisáramos si el ritmo, la comunicación y el compromiso tienen sentido para ambos.' },
    ];

    // — Progreso con datos reales: si iniciada_at/dias_prueba_total faltan o
    //   son inválidos, NO se inventan días (copy genérico sin números). —
    const totalDias = Number(rel.dias_prueba_total) > 0 ? Number(rel.dias_prueba_total) : 30;
    const inicioMs = rel.iniciada_at ? new Date(rel.iniciada_at).getTime() : NaN;
    const diasValidos = Number.isFinite(inicioMs) && inicioMs <= Date.now();
    const finMs = inicioMs + totalDias * 86400000;
    const vencido = diasValidos && Date.now() > finMs;
    const diasRestantes = diasValidos ? Math.max(0, Math.ceil((finMs - Date.now()) / 86400000)) : null;
    const sesionesUsadas = Math.min((sesiones || []).length, 3);
    if (diasValidos) {
      const diasTranscurridos = Math.min(Math.floor((Date.now() - inicioMs) / 86400000), totalDias);
      const pct = Math.round((diasTranscurridos / totalDias) * 100);
      document.getElementById('prog-pct').textContent = `${diasTranscurridos} / ${totalDias}`;
      document.getElementById('prog-fill').style.width = `${pct}%`;
      document.getElementById('prog-text').textContent = vencido
        ? 'El periodo de prueba ha terminado'
        : `Quedan ${diasRestantes} día${diasRestantes !== 1 ? 's' : ''}`;
    } else {
      document.getElementById('prog-pct').textContent = '—';
      document.getElementById('prog-text').textContent = 'Periodo de prueba en curso';
    }
    const sesCountEl = document.getElementById('sesiones-count');
    if (sesCountEl) sesCountEl.textContent = `${sesionesUsadas}/3`;

    // — Banda de decisión (sobre cerrado) —
    await refrescarDecision();

    // — Chat header / badge —
    document.getElementById('chat-title').textContent = otroNombre;
    const badgeEl = document.getElementById('chat-badge');
    if (rel.estado === 'consolidada') {
      badgeEl.textContent = '✓ Cadena consolidada';
      badgeEl.className = 'chat-badge consolidada';
      document.getElementById('chat-input-bar')?.setAttribute('style','pointer-events:none;opacity:0.4;');
      document.getElementById('send-btn').disabled = true;
      document.getElementById('msg-input').disabled = true;
    } else if (rel.estado === 'cancelada') {
      badgeEl.textContent = '✗ Periodo cancelado';
      badgeEl.className = 'chat-badge cancelada';
      document.getElementById('send-btn').disabled = true;
      document.getElementById('msg-input').disabled = true;
    } else if (rel.estado === 'finalizada') {
      badgeEl.textContent = '— Periodo finalizado';
      badgeEl.className = 'chat-badge cancelada';
      document.getElementById('send-btn').disabled = true;
      document.getElementById('msg-input').disabled = true;
    } else {
      badgeEl.textContent = vencido
        ? '⏳ Periodo vencido · toca decidir'
        : diasValidos
          ? `⏳ En prueba · quedan ${diasRestantes} día${diasRestantes !== 1 ? 's' : ''}`
          : '⏳ En prueba';
    }

    // — Cargar mensajes —
    const { data: msgs } = await supabase
      .from('mensajes')
      .select('*, autor:profiles!autor_id(nombre)')
      .eq('relacion_id', relacionId)
      .order('created_at', { ascending: true });

    const msgBox = document.getElementById('messages');
    msgBox.innerHTML = '';
    if ((msgs || []).length === 0) {
      msgBox.innerHTML = '<div class="msgs-empty">Aún no hay mensajes. Empieza la conversación.</div>';
    } else {
      msgs.forEach(m => appendMsg(m, uid));
    }
    msgBox.scrollTop = msgBox.scrollHeight;

    // La etapa 1 del ritual depende de si la conversación ha empezado.
    _msgsCount = (msgs || []).length;
    actualizarRitual();

    // — Marcar como leídos los mensajes del otro y actualizar badge global —
    async function marcarLeidos() {
      await supabase.from('mensajes')
        .update({ leido_at: new Date().toISOString() })
        .eq('relacion_id', relacionId)
        .neq('autor_id', uid)
        .is('leido_at', null);
      // Recalcular badge teniendo en cuenta otros chats no leídos
      await refreshMsgBadge();
    }
    marcarLeidos();

    // — Realtime: mensajes nuevos —
    supabase.channel(`mensajes-${relacionId}`)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'mensajes',
        filter: `relacion_id=eq.${relacionId}`
      }, async (payload) => {
        const { data: m } = await supabase
          .from('mensajes')
          .select('*, autor:profiles!autor_id(nombre)')
          .eq('id', payload.new.id)
          .single();
        if (m) {
          // Remove empty state if present
          const empty = msgBox.querySelector('.msgs-empty');
          if (empty) empty.remove();
          appendMsg(m, uid);
          msgBox.scrollTop = msgBox.scrollHeight;
          // Si el mensaje es del otro, marcarlo como leído de inmediato
          if (m.autor_id !== uid) marcarLeidos();
          // El primer mensaje completa la etapa 1 del ritual.
          _msgsCount++;
          actualizarRitual();
        }
      })
      .subscribe();

    // ─── Helpers ────────────────────────────────────────────

    // ─── Ritual guiado del periodo de prueba (spec 041) ──────
    // Guía UI-only: no cambia la lógica de consolidación ni los límites
    // (30 días / 3 sesiones máximo) definidos en specs anteriores.
    // (ETAPAS_GUIA y PLANTILLAS se declaran arriba, junto al estado del ritual,
    //  porque actualizarRitual() se invoca antes de llegar a esta sección.)

    // Etapa actual del camino, derivada SOLO de datos reales.
    function etapaActual() {
      if (_resultado) return 6;
      if (_miDec) return 5;
      if (rel.estado !== 'prueba') return 6;          // cerrada por otra vía (legacy)
      if (vencido || sesionesUsadas >= 3) return 5;   // toca decidir
      if (_msgsCount === 0) return 1;                 // aún sin conversación
      return Math.min(2 + sesionesUsadas, 4);         // 0/1/2 sesiones → etapa 2/3/4
    }

    function actualizarRitual() {
      const cont = document.getElementById('ritual-list');
      if (!cont) return;
      const cur = etapaActual();
      cont.innerHTML = ETAPAS_GUIA.map((e, idx) => {
        const n = idx + 1;
        const cls = n < cur ? 'done' : n === cur ? 'current' : '';
        // Estado textual (no solo color): "Etapa actual" marca dónde estáis.
        let estadoTxt = n < cur ? 'Completada' : n === cur ? 'Etapa actual' : 'Pendiente';
        if (n >= 2 && n <= 4) {
          // Las etapas 2–4 reflejan la sesión real correspondiente si existe.
          const s = (sesiones || []).find(x => x.numero === n - 1);
          if (s?.completada_at) estadoTxt = (n === cur ? 'Etapa actual · ' : '') + 'Completada · ' + formatDate(s.completada_at);
          else if (s?.programada_at) estadoTxt = (n === cur ? 'Etapa actual · ' : '') + 'Programada · ' + formatDate(s.programada_at);
          else if (n === cur) estadoTxt = 'Etapa actual · Por acordar';
        }
        if (n === 5 && _miDec) estadoTxt = 'Tu decisión está guardada';
        if (n === 6 && _resultado) {
          estadoTxt = _resultado.resultado === 'consolidada'
            ? 'La relación se ha consolidado'
            : 'La relación no se ha consolidado';
        }
        const det = `
          <details class="rit-det"><summary>Ver guía</summary>
            <div class="rit-det-body">${esc(e.det)}${e.puntos.length ? '<ul>' + e.puntos.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>' : ''}</div>
          </details>`;
        return `<div class="rit-item ${cls}">
          <span class="rit-num" aria-hidden="true">${n}</span>
          <div class="rit-info">
            <div class="rit-title">${n}. ${esc(e.titulo)}</div>
            <div class="rit-state">${esc(estadoTxt)}</div>
            ${det}
          </div>
        </div>`;
      }).join('');
      renderNextStep();
      renderPlantillas();
    }

    // Próximo paso recomendado + CTA principal según el estado real.
    function renderNextStep() {
      const wrap = document.getElementById('next-step');
      if (!wrap) return;
      const txt = document.getElementById('next-step-txt');
      const ctaWrap = document.getElementById('next-step-cta');
      const btn = document.getElementById('next-step-btn');
      let mensaje = '', ctaLabel = '', ctaAction = null;

      if (_resultado) {
        mensaje = _resultado.resultado === 'consolidada'
          ? 'La relación queda consolidada.'
          : 'La relación no se consolida. La prueba ha servido para decidir con claridad.';
      } else if (_miDec) {
        mensaje = 'Tu decisión queda guardada de forma privada hasta que ambas partes hayan decidido. Cuando estén ambas decisiones, Aurea mostrará el resultado.';
      } else if (rel.estado !== 'prueba') {
        wrap.hidden = true; return;
      } else if (vencido) {
        mensaje = 'El periodo de prueba ha terminado. Ya podéis tomar una decisión.';
        ctaLabel = 'Tomar decisión'; ctaAction = irADecision;
      } else if (sesionesUsadas >= 3) {
        mensaje = 'Ya habéis usado las tres sesiones de prueba. Ahora toca decidir si queréis consolidar.';
        ctaLabel = 'Tomar decisión'; ctaAction = irADecision;
      } else if (sesionesUsadas === 2) {
        mensaje = 'Antes de decidir, usad la tercera sesión para revisar si la relación tiene sentido para ambos.';
        ctaLabel = 'Continuar conversación'; ctaAction = irAlChat;
      } else if (sesionesUsadas === 1) {
        mensaje = 'Ya habéis empezado. La segunda sesión puede servir para probar la forma real de acompañamiento.';
        ctaLabel = 'Continuar conversación'; ctaAction = irAlChat;
      } else if (_msgsCount === 0) {
        mensaje = `Aún no habéis registrado ninguna sesión de prueba. Empezad por acordar la intención de estos ${totalDias} días.`;
        ctaLabel = 'Abrir conversación'; ctaAction = irAlChat;
      } else {
        mensaje = 'Aún no habéis registrado ninguna sesión de prueba. La primera puede servir como diagnóstico del punto de partida.';
        ctaLabel = 'Continuar conversación'; ctaAction = irAlChat;
      }
      wrap.hidden = false;
      txt.textContent = mensaje;
      if (ctaLabel) {
        ctaWrap.hidden = false;
        btn.textContent = ctaLabel;
        btn.onclick = ctaAction;
      } else {
        ctaWrap.hidden = true;
      }
    }

    function irAlChat() {
      const inp = document.getElementById('msg-input');
      if (inp && !inp.disabled) {
        inp.scrollIntoView({ behavior: 'smooth', block: 'center' });
        inp.focus({ preventScroll: true });
      }
    }
    function irADecision() {
      const band = document.getElementById('decision-band');
      if (band) band.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function renderPlantillas() {
      const wrap = document.getElementById('tpl-wrap');
      if (!wrap) return;
      // Solo tienen sentido mientras la conversación sigue abierta.
      const inp = document.getElementById('msg-input');
      const chatActivo = rel.estado === 'prueba' && !_resultado && inp && !inp.disabled;
      wrap.hidden = !chatActivo;
      if (_tplRendered || !chatActivo) return;
      _tplRendered = true;
      document.getElementById('tpl-list').innerHTML = PLANTILLAS.map((t, i) => `
        <div class="tpl-item">
          <div class="tpl-label">${esc(t.label)}</div>
          <div class="tpl-text">${esc(t.texto)}</div>
          <div class="tpl-btns">
            <button type="button" onclick="window.copiarPlantilla(${i}, this)">Copiar</button>
            <button type="button" onclick="window.usarPlantilla(${i})">Usar en el chat</button>
          </div>
        </div>`).join('');
    }

    window.copiarPlantilla = async function(i, btn) {
      const t = PLANTILLAS[i];
      if (!t || !btn) return;
      try {
        await navigator.clipboard.writeText(t.texto);
        btn.textContent = 'Copiada ✓';
      } catch {
        btn.textContent = 'No se pudo copiar';
      }
      setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
    };

    window.usarPlantilla = function(i) {
      const t = PLANTILLAS[i];
      const inp = document.getElementById('msg-input');
      if (!t || !inp || inp.disabled) return;
      inp.value = t.texto;   // solo inserta: enviar sigue siendo decisión del usuario
      irAlChat();
    };

    function appendMsg(m, myUid) {
      const isMine = m.autor_id === myUid;
      const box = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
      div.innerHTML = `
        <div class="msg-bubble">${esc(m.texto)}</div>
        <div class="msg-meta">${isMine ? 'Tú' : esc(m.autor?.nombre || '?')} · ${formatDateChat(m.created_at)}</div>`;
      box.appendChild(div);
    }

    function isToday(ts) {
      const d = new Date(ts), n = new Date();
      return d.getDate() === n.getDate() && d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
    }
    function formatDate(ts) {
      return new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    function formatDateChat(ts) {
      if (isToday(ts)) return 'Hoy';
      return new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
    }
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ─── Acciones globales ───────────────────────────────────

    window.sendMsg = async function() {
      const t = document.getElementById('msg-input');
      const v = t.value.trim();
      if (!v) return;
      t.value = '';
      const { error } = await supabase.from('mensajes').insert({
        relacion_id: relacionId,
        autor_id: uid,
        texto: v
      });
      if (error) {
        console.error('Error al enviar mensaje:', error);
        t.value = v; // restaurar si falla
      }
      // El mensaje aparece vía suscripción realtime
    };

    window.openModal = function(type) {
      document.getElementById('modal-' + type).classList.add('open');
    };
    window.closeModals = function() {
      document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
    };

    // ─── Decisión de consolidación (sobre cerrado) ───────────
    let _decisionElegida = null;

    window.openDecision = function(tipo) {
      _decisionElegida = tipo;
      document.getElementById('decision-sub').innerHTML = tipo === 'consolidar'
        ? `Vas a indicar que <strong>sí</strong> quieres consolidar esta relación.<br>Tu decisión queda guardada de forma privada hasta que ambas partes hayan decidido.`
        : `Vas a indicar que <strong>prefieres no</strong> consolidar esta relación.<br>Tu decisión queda guardada de forma privada hasta que ambas partes hayan decidido.`;
      document.getElementById('decision-confirm-btn').textContent =
        tipo === 'consolidar' ? 'Confirmar: consolidar' : 'Confirmar: no consolidar';
      document.getElementById('modal-decision').classList.add('open');
    };

    window.confirmarDecision = async function() {
      if (!_decisionElegida) return;
      const btn = document.getElementById('decision-confirm-btn');
      btn.disabled = true;
      const { error } = await supabase.from('decisiones_consolidacion').insert({
        relacion_id: relacionId,
        user_id: uid,
        decision: _decisionElegida,
      });
      btn.disabled = false;
      if (error) {
        alert(error.code === '23505'
          ? 'Ya habías enviado tu decisión para esta relación.'
          : ('No se pudo guardar la decisión: ' + (error.message || error)));
        return;
      }
      closeModals();
      await refrescarDecision();
    };

    async function refrescarDecision() {
      const band = document.getElementById('decision-band');
      if (!band) return;

      // Resultado: solo existe (y es visible) cuando ambas partes han decidido.
      const { data: resultado } = await supabase
        .from('resultados_consolidacion')
        .select('resultado')
        .eq('relacion_id', relacionId)
        .maybeSingle();
      _resultado = resultado || null;   // estado para el ritual (spec 041)
      if (resultado) {
        const consolidada = resultado.resultado === 'consolidada';
        band.style.display = '';
        band.innerHTML = consolidada
          ? `<div class="ya-decidio">✓ La relación se ha consolidado.</div>`
          : `<div class="ya-decidio">La relación no se ha consolidado.</div>`;
        // Reflejar el cierre en el chat sin necesidad de recargar la página.
        const badge = document.getElementById('chat-badge');
        if (badge) {
          badge.textContent = consolidada ? '✓ Cadena consolidada' : '— Periodo finalizado';
          badge.className = 'chat-badge ' + (consolidada ? 'consolidada' : 'cancelada');
        }
        const sb = document.getElementById('send-btn'); if (sb) sb.disabled = true;
        const mi = document.getElementById('msg-input'); if (mi) mi.disabled = true;
        actualizarRitual();
        return;
      }

      // ¿He decidido ya? Solo puedo leer mi propia decisión (sobre cerrado).
      const { data: miDec } = await supabase
        .from('decisiones_consolidacion')
        .select('decision')
        .eq('relacion_id', relacionId)
        .eq('user_id', uid)
        .maybeSingle();
      _miDec = miDec || null;   // estado para el ritual (spec 041)
      if (miDec) {
        band.style.display = '';
        // Copia neutral (spec 041): no insinuar quién falta por decidir.
        band.innerHTML = `<div class="ya-decidio">Tu decisión queda guardada de forma privada hasta que ambas partes hayan decidido.</div>`;
        actualizarRitual();
        return;
      }

      // Relación ya cerrada por otra vía (legacy) → ocultar la banda.
      if (rel.estado !== 'prueba') { band.style.display = 'none'; actualizarRitual(); return; }

      // Aún no he decidido: mostrar las opciones.
      band.style.display = '';
      band.innerHTML =
        `<button class="btn-decision btn-accept" onclick="openDecision('consolidar')">Sí, consolidar</button>
         <button class="btn-decision btn-cancel" onclick="openDecision('no_consolidar')">No consolidar</button>`;
      actualizarRitual();
    }

    document.querySelectorAll('.overlay').forEach(o =>
      o.addEventListener('click', function(e) { if (e.target === this) closeModals(); })
    );
    })();
  </script>
</body>
</html>
