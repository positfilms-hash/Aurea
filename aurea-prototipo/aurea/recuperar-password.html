<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/scale.js"></script>
  <title>Recuperar acceso · Aurea</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:28px;}
    .auth-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:22px;}
    .auth-title{font-family:var(--font-serif);font-size:30px;font-weight:500;color:var(--text-primary);line-height:1.1;margin-bottom:8px;}
    .auth-sub{font-size:12px;font-weight:300;color:var(--text-muted);line-height:1.7;}
    .auth-fields{display:flex;flex-direction:column;gap:14px;}
    .btn-auth{font-family:var(--font-serif);font-size:17px;font-style:italic;color:var(--night);background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 4px 12px #C8973A33;transition:opacity 0.2s;width:100%;}
    .btn-auth:hover{opacity:0.88;}
    .btn-auth:disabled{opacity:0.5;cursor:default;}
    .auth-msg{display:none;font-size:12px;font-weight:300;text-align:center;line-height:1.6;}
    .auth-msg.ok{color:var(--gold);}
    .auth-msg.err{color:#ff6b6b;}
    .auth-footer{font-size:11px;font-weight:300;color:var(--text-faint);text-align:center;}
    .auth-footer a{color:var(--gold);text-decoration:none;}
    .auth-footer a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <a href="index.html"><img src="assets/logo.png" alt="Aurea" style="width:64px;height:64px;object-fit:contain;opacity:0.85;"></a>
    <div class="auth-box">
      <div>
        <div class="auth-title">Recuperar acceso</div>
        <p class="auth-sub">Escribe el email con el que creaste tu cuenta. Si existe una cuenta asociada, recibirás un enlace para cambiar la contraseña.</p>
      </div>

      <div class="auth-fields" id="rp-form">
        <div class="field-wrap">
          <span class="field-label">Correo electrónico</span>
          <input class="field-input" type="email" id="rp-email" placeholder="tu@correo.com" autocomplete="email">
        </div>
        <button class="btn-auth" id="rp-btn" onclick="enviarEnlace()">Enviar enlace de recuperación</button>
      </div>

      <div id="rp-msg" class="auth-msg"></div>

      <p class="auth-footer">
        ¿Ya la recuerdas? <a href="login.html">Volver a iniciar sesión</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { enviarRecuperacion } from './js/auth.js';

    const emailEl = document.getElementById('rp-email');
    const btn     = document.getElementById('rp-btn');
    const form    = document.getElementById('rp-form');
    const msg     = document.getElementById('rp-msg');

    // Validación básica de email (no exhaustiva; el envío real lo hace Supabase).
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function mostrarMsg(texto, tipo) {
      msg.textContent = texto;
      msg.className = 'auth-msg ' + tipo;
      msg.style.display = 'block';
    }

    window.enviarEnlace = async function() {
      const email = emailEl.value.trim();
      if (!EMAIL_RE.test(email)) {
        mostrarMsg('Escribe un email válido.', 'err');
        return;
      }

      btn.disabled = true;            // evita doble envío
      btn.textContent = 'Enviando…';
      msg.style.display = 'none';

      // El enlace vuelve a actualizar-password.html del mismo origen. Esa URL
      // debe estar en la allowlist de Supabase (ver riesgos del PR).
      const redirectTo = `${location.origin}/actualizar-password.html`;
      const { error } = await enviarRecuperacion(email, redirectTo);

      if (error) {
        // No revela existencia: resetPasswordForEmail no distingue email
        // inexistente; un error aquí es técnico o de límite de envíos.
        console.warn('No se pudo enviar el enlace de recuperación.');
        mostrarMsg('No hemos podido enviar el enlace ahora mismo. Inténtalo de nuevo.', 'err');
        btn.disabled = false;
        btn.textContent = 'Enviar enlace de recuperación';
        return;
      }

      // Mensaje neutral SIEMPRE en éxito (exista o no la cuenta).
      form.style.display = 'none';
      mostrarMsg('Si existe una cuenta con ese email, recibirás un enlace para recuperar el acceso.', 'ok');
    };

    emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') enviarEnlace(); });
  </script>
</body>
</html>
