<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/scale.js"></script>
  <title>Mis solicitudes · Aurea</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .layout{display:grid;grid-template-columns:200px 1fr;}
    .sidebar{align-self:start;position:sticky;top:var(--nav-height);height:calc(var(--real-vh) - var(--nav-height) - 36px);border-right:0.5px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:18px;background:var(--night-soft);overflow-y:auto;}
    .chip-side{font-size:11px;font-weight:300;color:var(--text-muted);border:0.5px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer;transition:all 0.18s;background:none;text-align:left;display:flex;align-items:center;justify-content:space-between;width:100%;}
    .chip-side:hover,.chip-side.on{color:var(--gold);border-color:var(--gold);background:var(--night-deep);}
    .chip-count{font-size:10px;color:var(--text-faint);}
    .chip-side.on .chip-count{color:rgba(200,151,58,0.4);}
    .filter-chips{display:flex;flex-direction:column;gap:4px;}
    .filter-divider{height:0.5px;background:var(--border);}
    input[type=range]{width:100%;accent-color:var(--gold);}
    .content{display:flex;flex-direction:column;}
    .content-header{padding:16px 24px;border-bottom:0.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
    .content-title{font-family:var(--font-serif);font-size:20px;font-weight:500;color:var(--text-primary);}
    .content-sub{font-size:11px;font-weight:300;color:var(--text-faint);margin-top:2px;}
    .col-header{display:grid;grid-template-columns:4px 44px 1fr 100px 80px 200px;gap:16px;padding:8px 24px;border-bottom:0.5px solid var(--border);flex-shrink:0;}
    .col-h{font-size:8px;font-weight:400;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-ghost);}
    .list{}
    .sol-row{display:grid;grid-template-columns:4px 44px 1fr 100px 80px 200px;gap:16px;padding:13px 24px;border-bottom:0.5px solid var(--border);align-items:center;transition:background 0.15s;}
    .sol-row:hover{background:var(--night-mid);}
    .ind{width:4px;border-radius:100px;flex-shrink:0;align-self:stretch;}
    .ind.nueva{background:var(--gold);}
    .ind.vista{background:var(--border-soft);}
    .ind.aceptada{background:var(--green);}
    .ind.rechazada{background:var(--red);}
    .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--text-primary);flex-shrink:0;}
    .sol-nombre{font-family:var(--font-serif);font-size:15px;font-weight:500;color:var(--text-primary);margin-bottom:2px;}
    .sol-disc{font-size:10px;font-weight:300;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);}
    .sol-loc{font-size:10px;font-weight:300;color:var(--text-faint);margin-top:2px;}
    .const-wrap{display:flex;flex-direction:column;gap:4px;}
    .const-top{display:flex;align-items:center;justify-content:space-between;}
    .const-n{font-family:var(--font-serif);font-size:13px;font-weight:500;color:var(--gold);}
    .const-bar-bg{height:4px;background:var(--border);border-radius:100px;overflow:hidden;}
    .const-bar{height:100%;border-radius:100px;background:linear-gradient(90deg,#A67828,#C8973A);}
    .sol-fecha{font-size:10px;font-weight:300;color:var(--text-faint);}
    .sol-actions{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
    .btn-small{font-family:var(--font-serif);font-size:12px;font-style:italic;color:var(--text-muted);background:none;border:0.5px solid var(--border);padding:6px 12px;border-radius:100px;cursor:pointer;transition:all 0.18s;white-space:nowrap;}
    .btn-small:hover{color:var(--gold);border-color:var(--gold);}
    .btn-ac{font-family:var(--font-serif);font-size:12px;font-style:italic;color:var(--night);background:var(--gold);border:none;padding:6px 14px;border-radius:100px;cursor:pointer;white-space:nowrap;}
    .btn-re{font-family:var(--font-serif);font-size:13px;color:var(--text-faint);background:none;border:0.5px solid var(--border);padding:5px 10px;border-radius:100px;cursor:pointer;}
    .btn-re:hover{color:var(--red);border-color:var(--red);}
    .plazas-bar{padding:10px 24px;border-top:0.5px solid var(--border);flex-shrink:0;display:flex;gap:20px;align-items:center;background:var(--night-soft);}
    .plaza-item{display:flex;align-items:center;gap:8px;}
    .plaza-dot{width:8px;height:8px;border-radius:50%;}
    .plaza-label{font-size:10px;font-weight:300;color:var(--text-faint);}
    .plaza-n{font-size:10px;font-weight:400;color:var(--text-primary);}
    .page-footer-bar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:36px;border-top:0.5px solid var(--border);background:var(--night-soft);}
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <div class="layout">
    <aside class="sidebar">
      <div><span class="section-label">Estado</span><div class="filter-chips"><button class="chip-side on">Todas <span class="chip-count">8</span></button><button class="chip-side">Nuevas <span class="chip-count">3</span></button><button class="chip-side">Vistas <span class="chip-count">2</span></button><button class="chip-side">Aceptadas <span class="chip-count">2</span></button><button class="chip-side">Rechazadas <span class="chip-count">1</span></button></div></div>
      <div class="filter-divider"></div>
      <div><span class="section-label">Formato</span><div class="filter-chips"><button class="chip-side on">Todos</button><button class="chip-side">Presencial <span class="chip-count">5</span></button><button class="chip-side">Online <span class="chip-count">3</span></button></div></div>
      <div class="filter-divider"></div>
      <div><span class="section-label">Constancia</span><div class="filter-chips"><button class="chip-side on">Cualquiera</button><button class="chip-side">Alta · +80</button><button class="chip-side">Media · 50–80</button><button class="chip-side">Baja · −50</button></div></div>
      <div class="filter-divider"></div>
      <div><span class="section-label">Ordenar por</span><div class="filter-chips"><button class="chip-side on">Más recientes</button><button class="chip-side">Constancia</button><button class="chip-side">Distancia</button></div></div>
    </aside>
    <div class="content">
      <div class="content-header"><div><div class="content-title">Solicitudes recibidas</div><div class="content-sub">8 solicitudes · 1 plaza disponible</div></div></div>
      <div class="col-header"><div></div><div></div><div class="col-h">Discípulo</div><div class="col-h">Constancia</div><div class="col-h">Recibida</div><div class="col-h"></div></div>
      <div class="list" id="lista"></div>
      <div class="plazas-bar">
        <div class="plaza-item"><div class="plaza-dot" style="background:var(--gold);"></div><span class="plaza-label">Plazas ocupadas</span><span class="plaza-n">3 / 4</span></div>
        <div class="plaza-item"><div class="plaza-dot" style="background:var(--border);border:0.5px solid var(--text-faint);"></div><span class="plaza-label">Plaza libre</span><span class="plaza-n">1</span></div>
      </div>
    </div>
  </div>
  <div class="page-footer-bar">
    <span class="footer-copy">© 2026 Aurea · Todos los derechos reservados</span>
    <div class="footer-legal">
      <a class="footer-legal-link" href="privacidad.html">Política de privacidad</a>
      <a class="footer-legal-link" href="privacidad.html">Términos y condiciones</a>
      <a class="footer-legal-link" href="privacidad.html">Cookies</a>
    </div>
  </div>
  <div id="chat-container"></div>
  <script src="js/components.js"></script>
  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth } from './js/auth.js';
    import { checkNotificaciones } from './js/notif.js';

    document.getElementById('nav-container').innerHTML = renderNavAuth('solicitudes');
    checkNotificaciones();

    const LABEL = { nueva:'Nueva', vista:'Vista', aceptada:'Aceptada', rechazada:'Rechazada' };
    const ICON  = { nueva:'✦', vista:'◎', aceptada:'✓', rechazada:'✕' };
    const BADGE = { nueva:'badge-nueva', vista:'badge-vista', aceptada:'badge-aceptada', rechazada:'badge-rechazada' };

    let _maestroId = null;
    let _maxDisc   = 4;
    let _allSols   = [];
    let _filtroEstado = 'todas';

    // — Filtro de chips: solo la sección Estado (primera) afecta el filtro real —
    const _sections = document.querySelectorAll('.filter-chips');
    _sections[0]?.querySelectorAll('.chip-side').forEach(c => {
      c.addEventListener('click', function() {
        _sections[0].querySelectorAll('.chip-side').forEach(s => s.classList.remove('on'));
        this.classList.add('on');
        const t = this.textContent.trim().toLowerCase();
        _filtroEstado = t.startsWith('nueva') ? 'nueva'
          : t.startsWith('vista') ? 'vista'
          : t.startsWith('aceptada') ? 'aceptada'
          : t.startsWith('rechazada') ? 'rechazada'
          : 'todas';
        renderLista();
      });
    });
    // Resto de chips: solo feedback visual
    _sections.forEach((sec, i) => {
      if (i === 0) return;
      sec.querySelectorAll('.chip-side').forEach(c => {
        c.addEventListener('click', function() {
          sec.querySelectorAll('.chip-side').forEach(s => s.classList.remove('on'));
          this.classList.add('on');
        });
      });
    });

    function fechaRelativa(iso) {
      const d = Math.round((Date.now() - new Date(iso)) / 86400000);
      if (d === 0) return 'Hoy';
      if (d === 1) return 'Ayer';
      if (d < 7)  return `Hace ${d} días`;
      if (d < 14) return 'Hace 1 semana';
      return `Hace ${Math.round(d/7)} semanas`;
    }

    function acciones(sol) {
      if (sol.estado === 'aceptada') return `<span style="font-size:10px;font-style:italic;font-family:var(--font-serif);color:var(--green);">En periodo de prueba</span>`;
      if (sol.estado === 'rechazada') return `<span style="font-size:10px;font-style:italic;font-family:var(--font-serif);color:var(--red);">Solicitud rechazada</span>`;
      return `<button class="btn-small" onclick="verPerfil('${sol.discipulo_id}','${sol.id}')">Ver perfil</button>
              <button class="btn-ac" onclick="aceptar('${sol.id}','${sol.discipulo_id}','${sol.disciplina || ''}')">Aceptar</button>
              <button class="btn-re" onclick="rechazar('${sol.id}')">✕</button>`;
    }

    function renderLista() {
      const sols = _filtroEstado === 'todas'
        ? _allSols
        : _allSols.filter(s => s.estado === _filtroEstado);

      const lista = document.getElementById('lista');
      if (!sols.length) {
        lista.innerHTML = `<div style="padding:40px;text-align:center;font-size:13px;color:var(--text-faint);">
          No hay solicitudes${_filtroEstado !== 'todas' ? ' en este estado' : ''}.
        </div>`;
        return;
      }

      lista.innerHTML = sols.map(s => {
        const p = s.profiles || {};
        const nombre = ((p.nombre || '') + ' ' + (p.apellido || '')).trim() || 'Discípulo';
        const initials = ((p.nombre||'')[0] + (p.apellido||'')[0]).toUpperCase() || '?';
        const bg = p.avatar_color || 'var(--gold)';
        const loc = p.ubicacion || '—';
        const fecha = fechaRelativa(s.created_at);
        const constancia = 0; // sin datos de constancia aún
        return `
          <div class="sol-row">
            <div class="ind ${s.estado}"></div>
            <div class="avatar" style="background:${bg};">${initials}</div>
            <div>
              <div class="sol-nombre">${nombre}</div>
              <div class="sol-disc">${s.disciplina || '—'}</div>
              <div class="sol-loc">${loc}</div>
            </div>
            <div class="const-wrap">
              <div class="const-top"><span class="const-n">${constancia}</span><span style="font-size:9px;color:var(--text-ghost);">/ 100</span></div>
              <div class="const-bar-bg"><div class="const-bar" style="width:${constancia}%;"></div></div>
            </div>
            <div>
              <div class="sol-fecha">${fecha}</div>
              <span class="estado-badge ${BADGE[s.estado]}">${ICON[s.estado]} ${LABEL[s.estado]}</span>
            </div>
            <div class="sol-actions">${acciones(s)}</div>
          </div>`;
      }).join('');
    }

    function actualizarContadores() {
      const counts = { todas: _allSols.length, nueva: 0, vista: 0, aceptada: 0, rechazada: 0 };
      _allSols.forEach(s => { if (counts[s.estado] !== undefined) counts[s.estado]++; });

      // Actualizar sub-header
      const activas = counts.nueva + counts.vista;
      document.querySelector('.content-sub').textContent =
        `${_allSols.length} solicitudes · ${activas} sin responder`;

      // Actualizar chips (aproximado por posición)
      const chips = document.querySelectorAll('.filter-chips .chip-side');
      const labels = ['todas', 'nueva', 'vista', 'aceptada', 'rechazada'];
      chips.forEach((c, i) => {
        const cSpan = c.querySelector('.chip-count');
        if (cSpan && labels[i]) {
          cSpan.textContent = counts[labels[i]] ?? '';
        }
      });

      // Plazas bar
      const activos = counts.aceptada;
      const libres  = Math.max(0, _maxDisc - activos);
      document.querySelector('.plaza-n').textContent = `${activos} / ${_maxDisc}`;
      document.querySelectorAll('.plaza-n')[1].textContent = String(libres);
    }

    // — Acciones —
    window.verPerfil = function(discipuloId, solId) {
      location.href = `perfil-discipulo.html?id=${discipuloId}&sol=${solId}`;
    };

    window.aceptar = async function(solId, discipuloId, disciplina) {
      const { error: e1 } = await supabase.from('solicitudes').update({ estado: 'aceptada' }).eq('id', solId);
      if (e1) { alert('Error al aceptar. Inténtalo de nuevo.'); return; }
      const { data: rel, error: e2 } = await supabase.from('relaciones').insert({
        maestro_id:   _maestroId,
        discipulo_id: discipuloId,
        disciplina:   disciplina || '',
        estado:       'prueba',
      }).select('id').single();
      if (e2) { alert('Error al crear la relación: ' + e2.message); return; }
      location.href = `periodo-prueba.html?id=${rel.id}`;
    };

    window.rechazar = async function(solId) {
      await supabase.from('solicitudes').update({ estado: 'rechazada' }).eq('id', solId);
      await cargarSolicitudes();
    };

    // — Marcar como vista al cargar —
    async function marcarVistas(solIds) {
      if (!solIds.length) return;
      await supabase.from('solicitudes')
        .update({ estado: 'vista' })
        .in('id', solIds)
        .eq('estado', 'nueva');
    }

    async function cargarSolicitudes() {
      if (!_maestroId) return;
      const { data, error } = await supabase
        .from('solicitudes')
        .select(`id, disciplina, motivacion, estado, created_at, discipulo_id,
                 profiles!discipulo_id(nombre, apellido, avatar_color, ubicacion)`)
        .eq('maestro_id', _maestroId)
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('lista').innerHTML =
          `<div style="padding:40px;text-align:center;color:var(--text-faint);">Error al cargar solicitudes.</div>`;
        return;
      }

      _allSols = data || [];
      renderLista();
      actualizarContadores();

      // Marcar nuevas como vistas en background
      const nuevasIds = _allSols.filter(s => s.estado === 'nueva').map(s => s.id);
      marcarVistas(nuevasIds);
    }

    // — Init —
    async function init() {
      const session = await requireAuth();
      if (!session) return;
      const uid = session.user.id;

      const { data: maestro, error } = await supabase
        .from('maestro_perfiles')
        .select('id, disciplina, max_discipulos')
        .eq('id', uid)
        .single();

      if (error || !maestro) {
        document.getElementById('lista').innerHTML = `
          <div style="padding:60px;text-align:center;">
            <div style="font-family:var(--font-serif);font-size:20px;color:var(--text-secondary);margin-bottom:12px;">No eres maestro</div>
            <div style="font-size:12px;color:var(--text-faint);">Esta sección es para maestros que reciben solicitudes de discípulos.</div>
          </div>`;
        return;
      }

      _maestroId = maestro.id;
      _maxDisc   = maestro.max_discipulos || 4;
      document.querySelector('.content-title').textContent = 'Solicitudes recibidas';
      await cargarSolicitudes();
    }

    init();
  </script>
</body>
</html>
