<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/scale.js"></script>
  <title>Crear nueva contraseña · Aurea</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:28px;}
    .auth-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:22px;}
    .auth-title{font-family:var(--font-serif);font-size:30px;font-weight:500;color:var(--text-primary);line-height:1.1;margin-bottom:8px;}
    .auth-sub{font-size:12px;font-weight:300;color:var(--text-muted);line-height:1.7;}
    .auth-fields{display:flex;flex-direction:column;gap:14px;}
    .btn-auth{font-family:var(--font-serif);font-size:17px;font-style:italic;color:var(--night);background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 4px 12px #C8973A33;transition:opacity 0.2s;width:100%;}
    .btn-auth:hover{opacity:0.88;}
    .btn-auth:disabled{opacity:0.5;cursor:default;}
    .btn-auth-ghost{width:100%;font-size:12px;font-weight:300;color:var(--text-muted);background:none;border:0.5px solid var(--border);border-radius:100px;padding:12px;cursor:pointer;transition:all 0.2s;display:inline-block;text-align:center;text-decoration:none;}
    .btn-auth-ghost:hover{border-color:var(--border-gold);color:var(--text-primary);}
    .auth-msg{display:none;font-size:12px;font-weight:300;text-align:center;line-height:1.6;}
    .auth-msg.ok{color:var(--gold);}
    .auth-msg.err{color:#ff6b6b;}
    .auth-state{font-size:12px;font-weight:300;color:var(--text-muted);text-align:center;line-height:1.7;}
    .pw-hint{font-size:10px;font-weight:300;color:var(--text-faint);}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <a href="index.html"><img src="assets/logo.png" alt="Aurea" style="width:64px;height:64px;object-fit:contain;opacity:0.85;"></a>
    <div class="auth-box">
      <div>
        <div class="auth-title">Crear nueva contraseña</div>
        <p class="auth-sub">Elige una nueva contraseña para tu cuenta de Aurea.</p>
      </div>

      <!-- Verificando el enlace -->
      <div id="ap-loading" class="auth-state">Verificando el enlace…</div>

      <!-- Formulario (si el enlace es válido) -->
      <div class="auth-fields" id="ap-form" style="display:none;">
        <div class="field-wrap">
          <span class="field-label">Nueva contraseña</span>
          <input class="field-input" type="password" id="ap-pw1" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        </div>
        <div class="field-wrap">
          <span class="field-label">Repetir contraseña</span>
          <input class="field-input" type="password" id="ap-pw2" placeholder="Repite la contraseña" autocomplete="new-password">
          <span class="pw-hint">Al menos 8 caracteres.</span>
        </div>
        <button class="btn-auth" id="ap-btn" onclick="guardarPassword()">Guardar nueva contraseña</button>
      </div>

      <!-- Éxito -->
      <div id="ap-success" style="display:none;flex-direction:column;gap:16px;">
        <p class="auth-msg ok" style="display:block;">Tu contraseña se ha actualizado.</p>
        <a class="btn-auth-ghost" href="login.html">Ir a iniciar sesión</a>
      </div>

      <!-- Enlace inválido / caducado -->
      <div id="ap-invalid" style="display:none;flex-direction:column;gap:16px;">
        <p class="auth-msg err" style="display:block;">El enlace no es válido o ha caducado. Solicita uno nuevo.</p>
        <a class="btn-auth-ghost" href="recuperar-password.html">Solicitar nuevo enlace</a>
      </div>

      <div id="ap-msg" class="auth-msg"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { actualizarPassword } from './js/auth.js';

    const loadingEl = document.getElementById('ap-loading');
    const formEl    = document.getElementById('ap-form');
    const successEl = document.getElementById('ap-success');
    const invalidEl = document.getElementById('ap-invalid');
    const msgEl     = document.getElementById('ap-msg');
    const pw1El     = document.getElementById('ap-pw1');
    const pw2El     = document.getElementById('ap-pw2');
    const btn       = document.getElementById('ap-btn');

    let estado = 'pendiente';   // pendiente | form | success | invalid

    function mostrarForm() {
      if (estado !== 'pendiente') return;
      estado = 'form';
      // Limpiar la URL: el token de recuperación viene en el hash (#access_token…)
      // y, según el flujo, puede llegar un ?code=…. Una vez establecida la sesión
      // ya no se necesitan; los quitamos de la barra y del historial.
      try { history.replaceState(null, '', location.pathname); } catch { /* no crítico */ }
      loadingEl.style.display = 'none';
      formEl.style.display = 'flex';
    }
    function mostrarInvalido() {
      if (estado === 'success' || estado === 'form') return;
      estado = 'invalid';
      loadingEl.style.display = 'none';
      invalidEl.style.display = 'flex';
    }
    function mostrarMsg(texto, tipo) {
      msgEl.textContent = texto;
      msgEl.className = 'auth-msg ' + tipo;
      msgEl.style.display = 'block';
    }

    // — Detectar el enlace de recuperación —
    // Supabase (detectSessionInUrl) procesa el token del hash y establece una
    // sesión de recuperación, emitiendo un evento de auth. Si el enlace trae un
    // error explícito, lo tratamos como inválido directamente.
    const hashParams = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    if (hashParams.get('error') || hashParams.get('error_description')) {
      mostrarInvalido();
    } else {
      // Habilitar en cuanto haya sesión (evento de recuperación o ya logueado).
      supabase.auth.onAuthStateChange((_event, session) => { if (session) mostrarForm(); });
      // Fallback: sondear la sesión ~2s por si el evento ya ocurrió.
      (async () => {
        for (let i = 0; i < 8; i++) {
          const { data: { session } } = await supabase.auth.getSession();
          if (session) { mostrarForm(); return; }
          await new Promise(r => setTimeout(r, 250));
        }
        mostrarInvalido();
      })();
    }

    window.guardarPassword = async function() {
      const pw1 = pw1El.value;
      const pw2 = pw2El.value;
      msgEl.style.display = 'none';

      if (pw1.length < 8) { mostrarMsg('La contraseña debe tener al menos 8 caracteres.', 'err'); return; }
      if (pw1 !== pw2)    { mostrarMsg('Las contraseñas no coinciden.', 'err'); return; }

      btn.disabled = true;            // evita doble envío
      btn.textContent = 'Guardando…';

      const { error } = await actualizarPassword(pw1);

      if (error) {
        console.warn('No se pudo actualizar la contraseña.');
        // Si la sesión de recuperación ya no es válida, guiar a pedir otro enlace.
        const expirado = /session|token|expired|invalid|jwt/i.test(error.message || '');
        if (expirado) {
          estado = 'invalid';
          formEl.style.display = 'none';
          invalidEl.style.display = 'flex';
          return;
        }
        mostrarMsg('No hemos podido actualizar la contraseña ahora mismo. Inténtalo de nuevo.', 'err');
        btn.disabled = false;
        btn.textContent = 'Guardar nueva contraseña';
        return;
      }

      // Éxito: limpiar campos y cerrar la sesión de recuperación; entra de nuevo
      // con la nueva contraseña desde login.
      estado = 'success';
      pw1El.value = ''; pw2El.value = '';
      formEl.style.display = 'none';
      successEl.style.display = 'flex';
      try { await supabase.auth.signOut(); } catch { /* no bloquea el éxito */ }
    };

    pw2El.addEventListener('keydown', e => { if (e.key === 'Enter') guardarPassword(); });
  </script>
</body>
</html>
