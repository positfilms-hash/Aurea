<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Saliendo… · Aurea</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;}
    .msg{font-family:var(--font-serif);font-size:18px;font-style:italic;color:var(--text-muted);}
  </style>
</head>
<body>
  <img src="assets/logo.png" alt="Aurea" style="width:48px;opacity:0.5;">
  <p class="msg">Cerrando sesión…</p>
  <script type="module">
    import { supabase } from './js/supabase.js';
    await supabase.auth.signOut();
    // Limpiar tema y rol al cerrar sesión
    localStorage.removeItem('aurea-rol');
    localStorage.removeItem('aurea-rol-ts');
    localStorage.removeItem('aurea-tema');
    document.documentElement.classList.remove('theme-arena');
    window.location.href = 'index.html';
  </script>
</body>
</html>
