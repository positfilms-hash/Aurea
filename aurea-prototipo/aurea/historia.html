<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/scale.js"></script>
  <title>Mi historia · Aurea</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .page{display:grid;grid-template-columns:260px 1fr;}
    .sidebar{align-self:start;position:sticky;top:var(--nav-height);height:calc(var(--real-vh,100vh) - var(--nav-height) - 36px);border-right:0.5px solid var(--border);background:var(--night-soft);overflow-y:auto;display:flex;flex-direction:column;gap:0;}
    .sidebar-header{padding:24px 24px 16px;border-bottom:0.5px solid var(--border);flex-shrink:0;}
    .sidebar-title{font-family:var(--font-serif);font-size:20px;font-weight:500;color:var(--text-primary);}
    .sidebar-sub{font-size:11px;color:var(--text-muted);margin-top:4px;}
    .stat-card{margin:16px;background:var(--night-mid);border:0.5px solid var(--border);border-radius:10px;padding:16px;}
    .stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--border);}
    .stat-row:last-child{border-bottom:none;}
    .stat-lbl{font-size:11px;color:var(--text-muted);}
    .stat-val{font-family:var(--font-serif);font-size:18px;font-weight:500;color:var(--gold);}
    .filter-btns{display:flex;gap:6px;padding:16px 20px;border-bottom:0.5px solid var(--border);}
    .filter-btn{font-size:10px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;padding:5px 12px;border-radius:100px;border:0.5px solid var(--border);background:none;color:var(--text-muted);cursor:pointer;transition:all 0.2s;}
    .filter-btn.active{border-color:var(--gold);color:var(--gold);background:var(--night-deep);}
    .content{padding:28px 36px;overflow-y:auto;}
    .page-title{font-family:var(--font-serif);font-size:28px;font-weight:500;color:var(--text-primary);margin-bottom:6px;}
    .page-sub{font-size:12px;color:var(--text-muted);margin-bottom:28px;}
    .hist-item{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:20px 0;border-bottom:0.5px solid var(--border);}
    .hist-item:last-child{border-bottom:none;}
    .hist-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--night);flex-shrink:0;}
    .hist-name{font-size:14px;font-weight:500;color:var(--text-primary);}
    .hist-disc{font-size:12px;color:var(--gold);margin-top:2px;}
    .hist-meta{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
    .hist-tag{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px;white-space:nowrap;}
    .rol-tag{color:var(--text-muted);background:var(--night-mid);border:0.5px solid var(--border);}
    .tag-enviada{color:var(--gold);background:var(--night-deep);border:0.5px solid var(--border-gold);}
    .tag-aceptada{color:#3B6D11;background:#1A2A12;border:0.5px solid #3B6D1144;}
    .tag-noaceptada{color:var(--text-faint);background:var(--night-mid);border:0.5px solid var(--border);}
    .tag-prueba{color:var(--purple);background:#1A1830;border:0.5px solid #53489744;}
    .tag-prueba-venc{color:var(--amber,#C8973A);background:var(--night-deep);border:0.5px solid var(--border-gold);}
    .tag-consolidada{color:#3B6D11;background:#1A2A12;border:0.5px solid #3B6D1144;}
    .tag-noconsolidada{color:var(--text-faint);background:var(--night-mid);border:0.5px solid var(--border);}
    .tag-finalizada{color:#3B6D11;background:#1A2A12;border:0.5px solid #3B6D1144;}
    .tag-cancelada{color:var(--text-faint);background:var(--night-mid);border:0.5px solid var(--border);}
    .hist-dates{font-size:11px;color:var(--text-faint);}
    .hist-action{display:inline-block;margin-top:8px;font-family:var(--font-serif);font-size:13px;font-style:italic;color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
    .hist-action:hover{color:var(--gold);}
    .empty{padding:60px 36px;text-align:center;color:var(--text-faint);}
    .empty-icon{font-size:36px;margin-bottom:16px;}
    .empty-title{font-family:var(--font-serif);font-size:18px;font-style:italic;margin-bottom:8px;color:var(--text-secondary);}
    .empty-sub{font-size:12px;line-height:1.7;max-width:340px;margin:0 auto 18px;}
    .page-footer-bar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:36px;border-top:0.5px solid var(--border);background:var(--night-soft);}
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <div class="page">
    <!-- Sidebar con stats -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Mi historia</div>
        <div class="sidebar-sub">Tu recorrido de aprendizaje · privado</div>
      </div>
      <div class="stat-card">
        <div class="stat-row"><span class="stat-lbl">Solicitudes enviadas</span><span class="stat-val" id="st-sol">—</span></div>
        <div class="stat-row"><span class="stat-lbl">En periodo de prueba</span><span class="stat-val" id="st-prueba">—</span></div>
        <div class="stat-row"><span class="stat-lbl">Consolidadas</span><span class="stat-val" id="st-cons">—</span></div>
        <div class="stat-row"><span class="stat-lbl">No consolidadas</span><span class="stat-val" id="st-nocons">—</span></div>
      </div>
      <div class="filter-btns">
        <button class="filter-btn active" id="btn-todo" onclick="filtrar('todo')">Todo</button>
        <button class="filter-btn" id="btn-discipulo" onclick="filtrar('discipulo')">Como discípulo</button>
        <button class="filter-btn" id="btn-maestro" onclick="filtrar('maestro')">Como maestro</button>
      </div>
    </div>

    <!-- Contenido principal -->
    <div id="content-area" class="content">
      <div class="page-title">Mi historia</div>
      <div class="page-sub">Cargando…</div>
    </div>
  </div>

  <div class="page-footer-bar">
    <span style="font-size:10px;color:var(--text-ghost);">© 2026 Aurea · Todos los derechos reservados</span>
  </div>

  <script src="js/components.js"></script>
  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth } from './js/auth.js';
    import { checkNotificaciones } from './js/notif.js';

    document.getElementById('nav-container').innerHTML = renderNavAuth('historia');
    checkNotificaciones();

    let _uid = null;
    let _eventos = [];
    let _filtro = 'todo';

    const esc = (typeof escHtml === 'function') ? escHtml : (s => s == null ? '' : String(s));

    // Solo permite color hex o var(--...); cualquier otra cosa cae a un valor seguro.
    function safeColor(c) {
      return (/^#[0-9A-Fa-f]{3,8}$/.test(c) || /^var\(--[\w-]+\)$/.test(c)) ? c : 'var(--gold)';
    }

    function formatDate(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });
    }
    function ini(p) {
      return ((p?.nombre||'')[0] + (p?.apellido||'')[0]).toUpperCase() || '?';
    }
    function nombreCompleto(p) {
      return ((p?.nombre||'') + ' ' + (p?.apellido||'')).trim() || '—';
    }

    window.filtrar = function(f) {
      _filtro = f;
      ['todo','discipulo','maestro'].forEach(id => {
        document.getElementById('btn-'+id).classList.toggle('active', id === f);
      });
      renderLista();
    };

    function renderVacio(content) {
      content.innerHTML = `
        <div class="page-title">Mi historia</div>
        <div class="empty">
          <div class="empty-icon">📜</div>
          <div class="empty-title">Todavía no tienes historial de aprendizaje</div>
          <div class="empty-sub">Cuando envíes solicitudes o empieces relaciones de prueba, aparecerán aquí.</div>
          <a href="discover.html" class="btn-primary">Explorar maestros</a>
        </div>`;
    }

    function renderLista() {
      const evs = _eventos.filter(e => _filtro === 'todo' ? true : e.rol === _filtro);
      const content = document.getElementById('content-area');

      if (!_eventos.length) { renderVacio(content); return; }

      if (!evs.length) {
        content.innerHTML = `
          <div class="page-title">Mi historia</div>
          <div class="empty">
            <div class="empty-icon">📜</div>
            <div class="empty-title">Sin actividad en esta vista</div>
            <div class="empty-sub">Prueba con otro filtro.</div>
          </div>`;
        return;
      }

      const html = evs.map(e => `
        <div class="hist-item">
          <div class="hist-avatar" style="background:${safeColor(e.otro?.avatar_color)};">${esc(ini(e.otro))}</div>
          <div>
            <div class="hist-name">${esc(nombreCompleto(e.otro))}</div>
            <div class="hist-disc">${esc(e.disciplina || '—')}</div>
            <div class="hist-meta">
              <span class="hist-tag ${e.cls}">${e.label}</span>
              <span class="hist-tag rol-tag">${e.rol === 'maestro' ? 'Como maestro' : 'Como discípulo'}</span>
              <span class="hist-dates">${formatDate(e.fecha)}</span>
            </div>
            ${e.accion ? `<a class="hist-action" href="${e.accion}">${e.accionLabel} →</a>` : ''}
          </div>
        </div>`).join('');

      content.innerHTML = `
        <div class="page-title">Mi historia</div>
        <div class="page-sub">${evs.length} evento${evs.length!==1?'s':''} · de más reciente a más antiguo</div>
        ${html}`;
    }

    function renderError(content) {
      content.innerHTML = `
        <div class="page-title">Mi historia</div>
        <div class="empty">
          <div class="empty-icon">·</div>
          <div class="empty-title">No hemos podido cargar tu historial ahora mismo</div>
          <div class="empty-sub">Vuelve a intentarlo en un momento.</div>
        </div>`;
    }

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      _uid = session.user.id;
      const content = document.getElementById('content-area');

      try {
        const [solRes, relRes] = await Promise.all([
          supabase.from('solicitudes')
            .select('id, disciplina, estado, created_at, maestro_id, maestro:profiles!maestro_id(nombre, apellido, avatar_color)')
            .eq('discipulo_id', _uid)
            .order('created_at', { ascending: false }),
          supabase.from('relaciones')
            .select('id, disciplina, estado, iniciada_at, finalizada_at, consolidada_at, updated_at, dias_prueba_total, maestro_id, discipulo_id, pm:profiles!maestro_id(nombre,apellido,avatar_color), pd:profiles!discipulo_id(nombre,apellido,avatar_color)')
            .or(`maestro_id.eq.${_uid},discipulo_id.eq.${_uid}`)
            .order('updated_at', { ascending: false }),
        ]);

        if (solRes.error || relRes.error) { renderError(content); return; }

        const sols = solRes.data || [];
        const rels = relRes.data || [];

        // Resultados de consolidación (si la tabla existe; degradar si no).
        const relIds = rels.map(r => r.id);
        const resultadosMap = {};
        if (relIds.length) {
          const { data: resData } = await supabase
            .from('resultados_consolidacion')
            .select('relacion_id, resultado')
            .in('relacion_id', relIds);
          (resData || []).forEach(x => { resultadosMap[x.relacion_id] = x.resultado; });
        }

        const eventos = [];

        // Solicitudes: se muestran todas como eventos propios (no se deduplican
        // contra relaciones, porque solicitud_id no se rellena y la solicitud se
        // marca aceptada antes de crear la relación → deduplicar perdería eventos).
        sols.forEach(s => {
          let label, cls;
          if (s.estado === 'rechazada')     { label = 'Solicitud no aceptada'; cls = 'tag-noaceptada'; }
          else if (s.estado === 'aceptada') { label = 'Solicitud aceptada';    cls = 'tag-aceptada'; }
          else                              { label = 'Solicitud enviada';     cls = 'tag-enviada'; }
          eventos.push({
            rol: 'discipulo',
            otro: s.maestro,
            disciplina: s.disciplina,
            fecha: s.created_at,
            label, cls,
            accion: s.maestro_id ? `perfil-maestro.html?id=${s.maestro_id}` : null,
            accionLabel: 'Ver maestro',
          });
        });

        // Relaciones (ambos roles).
        rels.forEach(r => {
          const esMaestro = r.maestro_id === _uid;
          const otro = esMaestro ? r.pd : r.pm;
          const rol  = esMaestro ? 'maestro' : 'discipulo';
          let label, cls;
          let accion = `periodo-prueba.html?id=${r.id}`;
          let accionLabel = 'Ver relación';

          if (r.estado === 'prueba') {
            const total = r.dias_prueba_total || 30;
            const vencido = r.iniciada_at &&
              Date.now() > new Date(r.iniciada_at).getTime() + total * 86400000;
            label = vencido ? 'Periodo de prueba terminado' : 'Periodo de prueba activo';
            cls   = vencido ? 'tag-prueba-venc' : 'tag-prueba';
          } else if (r.estado === 'consolidada') {
            label = 'Relación consolidada'; cls = 'tag-consolidada';
          } else if (r.estado === 'finalizada') {
            if (resultadosMap[r.id] === 'no_consolidada') {
              label = 'Relación no consolidada'; cls = 'tag-noconsolidada';
            } else {
              label = 'Relación finalizada'; cls = 'tag-finalizada';
            }
          } else if (r.estado === 'cancelada') {
            label = 'Periodo cancelado'; cls = 'tag-cancelada';
          } else {
            label = r.estado; cls = 'tag-cancelada';
          }

          eventos.push({
            rol, otro,
            disciplina: r.disciplina,
            fecha: r.finalizada_at || r.consolidada_at || r.updated_at || r.iniciada_at,
            label, cls, accion, accionLabel,
          });
        });

        eventos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        _eventos = eventos;

        // Stats
        document.getElementById('st-sol').textContent    = sols.length;
        document.getElementById('st-prueba').textContent = rels.filter(r => r.estado === 'prueba').length;
        document.getElementById('st-cons').textContent   = rels.filter(r => r.estado === 'consolidada').length;
        document.getElementById('st-nocons').textContent = rels.filter(r => resultadosMap[r.id] === 'no_consolidada').length;

        renderLista();
      } catch (err) {
        renderError(content);
      }
    }

    init();
  </script>
</body>
</html>
