<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/scale.js"></script>
  <title>Discover · Aurea</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .layout{display:grid;grid-template-columns:220px 1fr;}
    .sidebar{align-self:start;position:sticky;top:var(--nav-height);height:calc(var(--real-vh) - var(--nav-height) - 36px);border-right:0.5px solid var(--border);padding:16px;overflow-y:auto;background:var(--night-soft);}
    .filter-chips{display:flex;flex-wrap:wrap;gap:4px;}
    .filter-section{margin-bottom:18px;}
    .filter-divider{height:0.5px;background:var(--border);margin:0 0 18px;}
    .hash-input-wrap{position:relative;margin-bottom:6px;}
    .hash-prefix{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:11px;}
    .hash-input{width:100%;background:var(--night-mid);border:0.5px solid var(--border-soft);border-radius:4px;padding:7px 10px 7px 20px;font-size:11px;color:var(--text-primary);outline:none;}
    .hash-input:focus{border-color:var(--gold);}
    input[type=range]{width:100%;accent-color:var(--gold);}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .toggle-label{font-size:11px;font-weight:300;color:var(--text-muted);}
    .range-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
    .range-val{font-size:11px;color:var(--gold);}
    .main-content{display:flex;flex-direction:column;}
    .page-footer-bar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:36px;border-top:0.5px solid var(--border);background:var(--night-soft);}
    .list-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-shrink:0;border-bottom:0.5px solid var(--border);}
    .list-title{font-size:10px;font-weight:300;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-faint);}
    .sort-select{font-size:10px;color:var(--text-muted);background:var(--night-mid);border:0.5px solid var(--border);border-radius:4px;padding:4px 8px;outline:none;cursor:pointer;}
    /* — Cards de descubrimiento (spec 019) — */
    .cards-wrap{padding:var(--space-5) var(--space-5) var(--space-8);}
    .cards{display:grid;grid-template-columns:1fr;gap:var(--space-5);}
    @media(min-width:600px){ .cards{grid-template-columns:repeat(2,1fr);} }
    @media(min-width:1280px){ .cards{grid-template-columns:repeat(3,1fr);} }
    .cards-state{grid-column:1/-1;padding:48px 16px;text-align:center;font-size:13px;color:var(--text-faint);}
    .mcard{display:flex;flex-direction:column;background:var(--night-mid);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:border-color .18s,transform .18s;}
    .mcard:hover{border-color:var(--gold);transform:translateY(-2px);}
    .mcard-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5) var(--space-5) var(--space-4);}
    .mcard-avatar{width:60px;height:60px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--night);overflow:hidden;background:var(--gold);}
    .mcard-avatar img{width:100%;height:100%;object-fit:cover;}
    .mcard-id{min-width:0;}
    .mcard-name{font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--text-primary);line-height:1.2;overflow-wrap:break-word;}
    .mcard-cat{font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:4px;line-height:1.3;}
    .mcard-body{display:flex;flex-direction:column;gap:var(--space-3);padding:0 var(--space-5);flex:1;}
    .mcard-disc{font-family:var(--font-serif);font-style:italic;font-size:15px;color:var(--text-secondary);}
    .mcard-frase{font-size:13px;font-weight:300;color:var(--text-muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    .mcard-tags{display:flex;flex-wrap:wrap;gap:5px;}
    .mcard-tag{font-size:10px;color:var(--text-faint);border:0.5px solid var(--border);padding:3px 9px;border-radius:100px;}
    .mcard-meta{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-5) 0;font-size:12px;color:var(--text-muted);}
    .mcard-rep{color:var(--gold);font-weight:500;}
    .mcard-actions{display:flex;gap:var(--space-2);padding:var(--space-4) var(--space-5) var(--space-5);margin-top:auto;}
    .btn-card{flex:1;min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;text-align:center;border-radius:100px;font-size:12px;font-weight:500;letter-spacing:.05em;transition:all .18s;cursor:pointer;}
    .btn-ver{background:var(--gold);color:var(--night);border:1px solid var(--gold);}
    .btn-ver:hover{opacity:.88;}
    .btn-solicitar{background:none;color:var(--gold);border:0.5px solid var(--border-gold);}
    .btn-solicitar:hover{background:rgba(200,151,58,.08);}
    /* — Filtros (spec 024) — */
    .filter-row{display:flex;flex-direction:column;}
    /* En móvil el panel de filtros pasa a una barra compacta arriba (no se oculta). */
    @media(max-width:899px){
      .sidebar{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);}
      .filter-section{margin-bottom:0;}
      .filter-row{flex-direction:row;gap:var(--space-3);}
      .filter-row .filter-section{flex:1;min-width:0;}
    }
    .pagination{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px;border-top:0.5px solid var(--border);flex-shrink:0;}
    .pg-btn{font-size:10px;font-weight:300;color:var(--text-muted);border:0.5px solid var(--border);background:none;padding:6px 11px;border-radius:4px;cursor:pointer;transition:all 0.18s;}
    .pg-btn:hover{color:var(--gold);border-color:var(--gold);}
    .pg-btn.active{color:var(--night);background:var(--gold);border-color:var(--gold);}
    .pg-btn:disabled{opacity:0.3;cursor:default;}
    .pg-info{font-size:10px;color:var(--text-faint);margin:0 2px;}
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="filter-section">
        <span class="section-label">Buscar</span>
        <input id="f-search" class="field-input" type="text" autocomplete="off"
               placeholder="Buscar por maestro, oficio, tema o inquietud" style="font-size:12px;">
      </div>
      <div class="filter-row">
        <div class="filter-section">
          <span class="section-label">Categoría</span>
          <select id="f-categoria" class="field-input" style="cursor:pointer;"></select>
        </div>
        <div class="filter-section">
          <span class="section-label">Subcategoría</span>
          <select id="f-subcategoria" class="field-input" style="cursor:pointer;" disabled>
            <option value="">Todas</option>
          </select>
        </div>
      </div>
      <button id="btn-limpiar" type="button" class="btn-secondary" style="width:100%;">Limpiar filtros</button>
    </aside>
    <div class="main-content">
      <div class="list-header"><span class="list-title" id="list-title">Cargando maestros…</span></div>
      <div class="cards-wrap"><div class="cards" id="cards-grid"></div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
  <div class="page-footer-bar">
    <span class="footer-copy">© 2026 Aurea · Todos los derechos reservados</span>
    <div class="footer-legal">
      <a class="footer-legal-link" href="privacidad.html">Política de privacidad</a>
      <a class="footer-legal-link" href="privacidad.html">Términos y condiciones</a>
      <a class="footer-legal-link" href="privacidad.html">Cookies</a>
    </div>
  </div>
  <div id="chat-container"></div>
  <script src="js/components.js"></script>
  <script type="module">
    import { supabase } from './js/supabase.js';
    import { checkNotificaciones } from './js/notif.js';
    import { CATS } from './js/categorias.js';

    // Nav inteligente: público si no hay sesión, auth si la hay.
    // _puedeSolicitar: solo discípulos (o ambos) autenticados ven el CTA secundario.
    let _puedeSolicitar = false;
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const { data: p } = await supabase.from('profiles')
        .select('nombre, apellido, rol').eq('id', session.user.id).single();
      const ini = p ? ((p.nombre||'')[0] + (p.apellido||'')[0]).toUpperCase() || '?' : '?';
      _puedeSolicitar = p?.rol === 'discipulo' || p?.rol === 'ambos';
      document.getElementById('nav-container').innerHTML = renderNavAuth('discover', ini);
      checkNotificaciones();
    } else {
      document.getElementById('nav-container').innerHTML = renderNavPublic('');
    }


    let ALL = [], FILTERED = [];
    const PER = 12;
    let page = 1;

    const grid     = document.getElementById('cards-grid');
    const pag      = document.getElementById('pagination');
    const titleEl  = document.getElementById('list-title');
    const searchEl = document.getElementById('f-search');
    const catEl    = document.getElementById('f-categoria');
    const subEl    = document.getElementById('f-subcategoria');

    function setEstado(html, titulo) {
      grid.innerHTML = `<div class="cards-state">${html}</div>`;
      pag.innerHTML = '';
      if (titulo != null) titleEl.textContent = titulo;
    }

    // — Mapear una fila de maestro a los datos de la card —
    function mapMaestro(m) {
      const p = m.profiles || {};
      const nombre = (p.nombre || '').trim();
      if (!nombre) return null;            // sin nombre visible → no se muestra card
      const apellido = (p.apellido || '').trim();
      return {
        id:           m.id,
        nombre:       nombre + (apellido ? ' ' + apellido[0] + '.' : ''),
        ini:          ((nombre[0] || '') + (apellido[0] || '')).toUpperCase() || '?',
        categoria:    (m.categoria || '').trim(),     // crudo (incl. 'Otra') para filtrar
        subcategoria: (m.subcategoria || '').trim(),
        disciplina:   (m.disciplina || '').trim(),
        frase:        (p.frase || '').trim(),
        tags:         (m.hashtags || []).slice(0, 3),
        rep:          m.reputacion,
        avatarUrl:    p.avatar_url || '',
        avatarBg:     p.avatar_color,
        abierto:      !!m.acepta_solicitudes,
      };
    }

    // — Card HTML (todo el contenido de usuario va escapado) —
    function cardHTML(m) {
      const href = `perfil-maestro.html?id=${encodeURIComponent(m.id)}`;
      // 'Otra' es el valor por defecto de perfiles sin categoría real → no se muestra.
      const showCat = m.categoria && m.categoria !== 'Otra';
      const cat = showCat
        ? (m.subcategoria ? `${escHtml(m.categoria)} › ${escHtml(m.subcategoria)}` : escHtml(m.categoria))
        : '';
      const avatar = m.avatarUrl
        ? `<span class="mcard-avatar"><img src="${escHtml(m.avatarUrl)}" alt="${escHtml(m.nombre)}"></span>`
        : `<span class="mcard-avatar" style="background:${safeColor(m.avatarBg)};">${escHtml(m.ini)}</span>`;
      const disc  = m.disciplina ? `<div class="mcard-disc">${escHtml(m.disciplina)}</div>` : '';
      const frase = m.frase ? `<p class="mcard-frase">${escHtml(m.frase)}</p>` : '';
      const tags  = m.tags.length ? `<div class="mcard-tags">${m.tags.map(t => `<span class="mcard-tag">${escHtml(t)}</span>`).join('')}</div>` : '';
      const rep   = (m.rep != null) ? `<span class="mcard-rep">★ ${Number(m.rep).toFixed(1)}</span>` : '';
      const meta  = `<div class="mcard-meta">${rep}<span>${m.abierto ? 'Acepta solicitudes' : 'Lista de espera'}</span></div>`;
      const solicitar = _puedeSolicitar
        ? `<button type="button" class="btn-card btn-solicitar" onclick="event.stopPropagation();window.location.href='${href}'">Solicitar aprendizaje</button>`
        : '';
      return `<div class="mcard" onclick="window.location.href='${href}'">
        <div class="mcard-head">
          ${avatar}
          <div class="mcard-id">
            <div class="mcard-name">${escHtml(m.nombre)}</div>
            ${cat ? `<div class="mcard-cat">${cat}</div>` : ''}
          </div>
        </div>
        <div class="mcard-body">${disc}${frase}${tags}</div>
        ${meta}
        <div class="mcard-actions">
          <button type="button" class="btn-card btn-ver" onclick="event.stopPropagation();window.location.href='${href}'">Ver perfil</button>
          ${solicitar}
        </div>
      </div>`;
    }

    // — Estado vacío (distinto del error), según autenticación —
    function vacio() {
      grid.innerHTML = '<div style="grid-column:1/-1">' + renderEmptyState({
        icon: '🔍',
        title: 'Todavía no hay maestros disponibles',
        body: session ? 'Puedes completar tu perfil o volver más adelante.' : 'Crea tu cuenta para empezar a explorar.',
        ctaLabel: session ? 'Completar perfil' : 'Crear cuenta',
        ctaHref:  session ? 'perfil-edicion.html' : 'registro.html',
      }) + '</div>';
      pag.innerHTML = '';
      titleEl.textContent = 'Maestros';
    }

    // — Estado "sin resultados por filtros" (distinto de "no hay maestros") —
    function sinResultados() {
      grid.innerHTML = '<div style="grid-column:1/-1">' + renderEmptyState({
        icon: '🔍',
        title: 'No hemos encontrado maestros con esos filtros',
        body: 'Prueba con otra categoría o términos de búsqueda distintos.',
        ctaLabel: 'Limpiar filtros',
        ctaHref: '#',
      }) + '</div>';
      // El CTA del estado vacío es un enlace; lo reconvertimos a "limpiar filtros".
      const cta = grid.querySelector('.empty-state .btn-primary');
      if (cta) cta.onclick = (ev) => { ev.preventDefault(); limpiarFiltros(); };
      pag.innerHTML = '';
      titleEl.textContent = 'Sin resultados';
    }

    // — Render + paginación (sobre la lista FILTRADA) —
    function renderPage(p) {
      if (!ALL.length) { vacio(); return; }            // no hay maestros en absoluto
      if (!FILTERED.length) { sinResultados(); return; } // filtros sin resultados
      page = p;
      const total = FILTERED.length, tPgs = Math.ceil(total / PER);
      const s = (p - 1) * PER, e = Math.min(s + PER, total);
      grid.innerHTML = FILTERED.slice(s, e).map(cardHTML).join('');
      titleEl.textContent = `Mostrando ${s + 1}–${e} de ${total} maestro${total !== 1 ? 's' : ''}`;
      if (tPgs <= 1) { pag.innerHTML = ''; return; }
      let h = `<button class="pg-btn" onclick="window._goPage(${p - 1})" ${p === 1 ? 'disabled' : ''}>←</button>`;
      for (let i = 1; i <= tPgs; i++) {
        if (i === 1 || i === tPgs || Math.abs(i - p) <= 1)
          h += `<button class="pg-btn ${i === p ? 'active' : ''}" onclick="window._goPage(${i})">${i}</button>`;
        else if (Math.abs(i - p) === 2)
          h += `<span class="pg-info">…</span>`;
      }
      h += `<button class="pg-btn" onclick="window._goPage(${p + 1})" ${p === tPgs ? 'disabled' : ''}>→</button>`;
      pag.innerHTML = h;
    }
    window._goPage = p => { renderPage(p); window.scrollTo({ top: 0, behavior: 'smooth' }); };

    // — Carga desde Supabase (estados: cargando / vacío / error) —
    async function cargarMaestros() {
      setEstado('Cargando maestros…', 'Cargando maestros…');
      try {
        const { data, error } = await supabase
          .from('maestro_perfiles')
          .select(`id, disciplina, categoria, subcategoria, hashtags, acepta_solicitudes, reputacion,
                   profiles (nombre, apellido, avatar_color, avatar_url, frase)`)
          .order('reputacion', { ascending: false, nullsFirst: false });
        if (error) throw error;
        ALL = (data || []).map(mapMaestro).filter(Boolean);
        aplicarFiltros();
      } catch (e) {
        console.warn('Error cargando maestros:', e?.message || e);
        setEstado('No hemos podido cargar los maestros ahora mismo.', 'Maestros');
      }
    }

    // ── Filtros (spec 024) ──────────────────────────────────────────────────
    // Categorías: lista canónica de categorias.js + 'Otra'.
    catEl.innerHTML =
      '<option value="">Todas las categorías</option>' +
      [...Object.keys(CATS), 'Otra'].map(c => `<option value="${c}">${c}</option>`).join('');

    // Subcategoría: depende de la categoría; deshabilitada si no aplica.
    function poblarSubcategorias(cat) {
      const subs = CATS[cat] || [];
      subEl.innerHTML = '<option value="">Todas</option>' +
        subs.map(s => `<option value="${s}">${s}</option>`).join('');
      subEl.disabled = subs.length === 0;   // 'Otra'/sin categoría → sin subcategorías
      subEl.value = '';
    }

    // Filtra ALL en cliente (volumen pequeño) y repinta.
    function aplicarFiltros() {
      const cat = catEl.value;
      const sub = subEl.value;
      const q   = (searchEl.value || '').trim().toLowerCase();
      FILTERED = ALL.filter(m => {
        if (cat && m.categoria !== cat) return false;
        if (sub && m.subcategoria !== sub) return false;
        if (q) {
          const heno = [m.nombre, m.disciplina, m.frase, m.categoria, m.subcategoria, (m.tags || []).join(' ')]
            .join(' ').toLowerCase();
          if (!heno.includes(q)) return false;
        }
        return true;
      });
      renderPage(1);
    }

    window.limpiarFiltros = function() {
      searchEl.value = '';
      catEl.value = '';
      poblarSubcategorias('');
      aplicarFiltros();
    };

    // Eventos
    let _t = null;
    searchEl.addEventListener('input', () => { clearTimeout(_t); _t = setTimeout(aplicarFiltros, 180); });
    catEl.addEventListener('change', () => { poblarSubcategorias(catEl.value); aplicarFiltros(); });
    subEl.addEventListener('change', aplicarFiltros);
    document.getElementById('btn-limpiar').addEventListener('click', limpiarFiltros);

    poblarSubcategorias('');
    cargarMaestros();
  </script>
</body>
</html>
