<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <script src="js/scale.js"></script>
  <title>Donaciones · Aurea</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .dona-wrap{min-height:calc(var(--real-vh) - var(--nav-height) - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px;gap:22px;}
    .dona-eyebrow{font-size:10px;font-weight:400;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-faint);}
    .dona-title{font-family:var(--font-serif);font-size:44px;font-weight:500;color:var(--text-primary);line-height:1.12;max-width:660px;}
    .dona-title em{font-style:italic;color:var(--gold);}
    .dona-text{font-size:14px;font-weight:300;color:var(--text-muted);line-height:1.9;max-width:480px;}
    .dona-actions{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <div class="dona-wrap">
    <div class="dona-eyebrow">Apoyo al proyecto</div>
    <h1 class="dona-title">Las donaciones<br><em>aún no están disponibles</em>.</h1>
    <p class="dona-text">Estamos preparando Aurea antes de abrir vías de apoyo económico. Gracias por tu interés — significa mucho.</p>
    <div class="dona-actions">
      <a href="index.html" class="btn-primary">Volver al inicio</a>
      <a href="contacto.html" class="btn-ghost">Contacto</a>
    </div>
  </div>
  <div id="footer-container"></div>
  <div id="chat-container"></div>
  <script src="js/components.js"></script>
  <script>
    document.getElementById('nav-container').innerHTML = renderNavPublic('');
    document.getElementById('footer-container').innerHTML = renderFooter();
  </script>
  <script type="module">
    import { supabase } from './js/supabase.js';
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const { data: p } = await supabase.from('profiles')
        .select('nombre, apellido').eq('id', session.user.id).single();
      const ini = p ? ((p.nombre||'')[0] + (p.apellido||'')[0]).toUpperCase() || '?' : '?';
      document.getElementById('nav-container').innerHTML = renderNavAuth('', ini);
    }
  </script>
</body>
</html>
